name: Condor CI

on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: condor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Condor CI / secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl --fail --silent --show-error --location "$url" --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          tar -xzf "$archive" gitleaks

      - name: Scan checkout for exposed secrets
        run: ./gitleaks dir --redact --exit-code 1 .

      - name: Scan repository history for exposed secrets
        run: ./gitleaks git --redact --exit-code 1

  build-and-test:
    name: Condor CI / build-and-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and audit NuGet dependencies
        run: dotnet restore Condor.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Verify whitespace formatting
        run: dotnet format whitespace Condor.slnx --verify-no-changes --no-restore --verbosity quiet

      - name: Verify style errors
        run: dotnet format style Condor.slnx --verify-no-changes --no-restore --severity error --verbosity quiet

      - name: Build Release
        run: dotnet build Condor.slnx -c Release --no-restore

      - name: Run test suite
        run: dotnet test Condor.slnx -c Release --no-build --no-restore

      - name: Compare complexity of changed methods
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          CONDOR_METRICS_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        shell: pwsh
        run: ./operacion/scripts/Compare-ChangedComplexity.ps1

      - name: Compare duplication in changed C# files
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          CONDOR_METRICS_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        shell: pwsh
        run: ./operacion/scripts/Compare-ChangedDuplication.ps1
